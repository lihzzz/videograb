<svg width="512" height="512" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Main background circle -->
  <circle cx="12" cy="12" r="11" fill="url(#gradient)" stroke="#2563eb" stroke-width="1"/>

  <!-- Gradient definition -->
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>

  <!-- Video play symbol -->
  <polygon points="8,8 17,12 8,16" fill="white" opacity="0.9"/>

  <!-- Download arrow -->
  <path d="M12 14V7" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <path d="M8 10L12 14L16 10" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Corner elements -->
  <circle cx="4" cy="4" r="1" fill="white" opacity="0.6"/>
  <circle cx="20" cy="4" r="1" fill="white" opacity="0.6"/>
  <circle cx="4" cy="20" r="1" fill="white" opacity="0.6"/>
  <circle cx="20" cy="20" r="1" fill="white" opacity="0.6"/>
</svg>